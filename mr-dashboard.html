<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MergeWatch — Open Pull Requests</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>

  <!-- Styles -->
  <link rel="stylesheet" href="mr-dashboard.css" />
</head>
<body>

  <!-- ── Page wrapper ─────────────────────────────────────── -->
  <div class="page-wrapper">

    <!-- ── Header ─────────────────────────────────────────── -->
    <header>
      <div class="header-left">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
            <path d="M6 9v6"/><path d="M18 9a9 9 0 0 0-9 9"/>
          </svg>
        </div>
        <div>
          <h1>Merge<span>Watch</span></h1>
          <div class="header-subtitle">open pull requests · staleness tracker</div>
        </div>
      </div>

      <div class="header-right">
        <!-- Age filter -->
        <div class="filter-group">
          <label class="filter-label" for="ageFilter">OPEN SINCE ≥</label>
          <div class="filter-input-wrap">
            <input type="number" id="ageFilter" class="filter-input" value="0" min="0" placeholder="0" />
            <span class="filter-unit">days</span>
          </div>
        </div>

        <!-- Repo filter -->
        <div class="filter-group">
          <label class="filter-label" for="repoFilter">REPO</label>
          <select id="repoFilter" class="filter-select">
            <option value="">All repos</option>
          </select>
        </div>

        <div class="header-divider"></div>

        <div class="last-updated" id="lastUpdated">—</div>
        <button class="btn-refresh" id="refreshBtn" onclick="loadData()">⟳ REFRESH</button>
      </div>
    </header>

    <!-- ── Summary strip ──────────────────────────────────── -->
    <div class="summary-strip" id="summaryStrip">
      <!-- populated by JS -->
    </div>

    <!-- ── Table container ────────────────────────────────── -->
    <div class="table-panel" id="tablePanel">
      <div class="state-overlay">
        <div class="spinner"></div>
        <div>Loading pull requests…</div>
      </div>
    </div>

  </div><!-- /.page-wrapper -->

  <!-- Logic -->
  <script src="mr-dashboard.js"></script>
</body>
</html>
