<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObservX — Observability Dashboard</title>

  <!-- External: Fonts -->

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>

  <!-- ============================================================
       STYLES  >>>  dashboard.css
       Edit this block to change layout, colours, and typography.
       ============================================================ -->

  <style>
    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ─────────────────────────────────────────── */
    :root {
      --bg:      #060810;
      --surface: #0d1117;
      --border:  #1e2736;
      --accent:  #00e5ff;
      --accent2: #7c3aed;
      --success: #00c896;
      --warn:    #f59e0b;
      --danger:  #ef4444;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --glow:    0 0 20px rgba(0,229,255,0.15);
    }

    /* ── Base ──────────────────────────────────────────────────── */
    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    /* ── Layout ────────────────────────────────────────────────── */
    .page-wrapper {
      position: relative; z-index: 1;
      max-width: 1400px; margin: 0 auto;
      padding: 0 24px 40px;
    }

    /* ── Header ────────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
      flex-wrap: wrap; gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo-mark {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: var(--glow);
    }
    h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .header-subtitle { font-size: 0.68rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    /* ── Status Pill ───────────────────────────────────────────── */
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; font-weight: 600;
      padding: 5px 12px; border-radius: 100px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    }
    .status-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 6px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Refresh Button & Timestamp ────────────────────────────── */
    .last-updated { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--muted); }
    .btn-refresh {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      padding: 6px 14px; border-radius: 6px;
      border: 1px solid var(--accent); background: transparent; color: var(--accent);
      cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em;
    }
    .btn-refresh:hover    { background: rgba(0,229,255,0.08); box-shadow: var(--glow); }
    .btn-refresh.spinning { opacity: 0.5; pointer-events: none; }

    /* ── Summary Cards ─────────────────────────────────────────── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px; margin-bottom: 28px;
    }
    .summary-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      position: relative; overflow: hidden; transition: border-color 0.2s;
    }
    .summary-card:hover { border-color: var(--accent); }
    .summary-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: var(--card-accent, var(--accent));
    }
    .card-label {
      font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
      letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
    }
    .card-value {
      font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em;
      color: var(--card-accent, var(--accent)); line-height: 1; margin-bottom: 4px;
    }
    .card-sub { font-size: 0.72rem; color: var(--muted); }

    /* ── Controls Row ──────────────────────────────────────────── */
    .controls-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .section-title { font-size: 0.85rem; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
    .section-title span { color: var(--muted); font-weight: 400; font-size: 0.8rem; margin-left: 8px; }

    /* ── Time Range Tabs ───────────────────────────────────────── */
    .time-range-tabs {
      display: flex; gap: 4px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 3px;
    }
    .tab {
      font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
      padding: 5px 12px; border-radius: 5px; border: none;
      background: transparent; color: var(--muted); cursor: pointer;
      transition: all 0.15s; letter-spacing: 0.04em;
    }
    .tab.active             { background: var(--accent); color: #000; font-weight: 600; }
    .tab:not(.active):hover { color: var(--text); }

    /* ── Chart Grid & Panels ───────────────────────────────────── */
    .chart-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-bottom: 28px; }
    @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .panel-title { font-size: 0.8rem; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
    .panel-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
      padding: 3px 8px; border-radius: 4px;
      background: rgba(0,229,255,0.08); color: var(--accent); border: 1px solid rgba(0,229,255,0.2);
    }
    .chart-wrap { position: relative; height: 240px; }

    /* ── Chart Legend ──────────────────────────────────────────── */
    .chart-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); cursor: pointer;
    }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

    /* ── Table ─────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; }
    thead tr { border-bottom: 1px solid var(--border); }
    th {
      text-align: left; padding: 10px 14px;
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none;
    }
    th:hover            { color: var(--accent); }
    th.sort-asc::after  { content: ' ↑'; color: var(--accent); }
    th.sort-desc::after { content: ' ↓'; color: var(--accent); }
    tbody tr {
      border-bottom: 1px solid rgba(30,39,54,0.6);
      transition: background 0.1s;
      animation: fadeUp 0.3s ease both;
    }
    tbody tr:hover      { background: rgba(0,229,255,0.03); }
    tbody tr:last-child { border-bottom: none; }
    td { padding: 11px 14px; vertical-align: middle; white-space: nowrap; }

    /* ── Table Cell Components ─────────────────────────────────── */
    .endpoint-cell { display: flex; flex-direction: column; gap: 2px; }
    .method-badge {
      display: inline-block; font-size: 0.58rem; font-weight: 700;
      padding: 1px 5px; border-radius: 3px; margin-right: 6px; letter-spacing: 0.05em;
    }
    .method-GET    { background: rgba(0,200,150,0.15);  color: var(--success); }
    .method-POST   { background: rgba(0,229,255,0.12);  color: var(--accent);  }
    .method-PUT    { background: rgba(245,158,11,0.12); color: var(--warn);    }
    .method-DELETE { background: rgba(239,68,68,0.12);  color: var(--danger);  }
    .method-PATCH  { background: rgba(124,58,237,0.15); color: #a78bfa;        }
    .endpoint-path { color: var(--text); }
    .endpoint-svc  { font-size: 0.62rem; color: var(--muted); margin-top: 1px; }
    .num         { text-align: right; }
    .num-success { color: var(--success); }
    .num-fail    { color: var(--danger);  }
    .bar-cell  { min-width: 100px; }
    .bar-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
    .bar-pct   { font-size: 0.58rem; color: var(--muted); margin-top: 3px; }
    .p99-cell  { color: var(--warn); }

    /* ── Error Badges ──────────────────────────────────────────── */
    .err-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .err-badge  { font-size: 0.6rem; padding: 2px 6px; border-radius: 3px; border: 1px solid; }
    .err-4xx    { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.3); color: var(--warn);   }
    .err-5xx    { background: rgba(239,68,68,0.08);  border-color: rgba(239,68,68,0.3);  color: var(--danger); }

    /* ── Success Rate Pill ─────────────────────────────────────── */
    .rate-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.68rem; font-weight: 600; padding: 3px 8px; border-radius: 5px; }
    .rate-high { background: rgba(0,200,150,0.1);  color: var(--success); }
    .rate-mid  { background: rgba(245,158,11,0.1); color: var(--warn);    }
    .rate-low  { background: rgba(239,68,68,0.1);  color: var(--danger);  }

    /* ── Loading / Error States ────────────────────────────────── */
    .state-overlay {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 300px; gap: 12px;
      color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-icon { font-size: 2rem; }
    .retry-btn {
      margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      padding: 6px 16px; border-radius: 6px;
      border: 1px solid var(--danger); background: transparent; color: var(--danger); cursor: pointer;
    }
    .retry-btn:hover { background: rgba(239,68,68,0.08); }

    /* ── Detail Row ─────────────────────────────────────────────── */
    .btn-expand {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      width: 24px; height: 24px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .btn-expand:hover   { border-color: var(--accent); color: var(--accent); }
    .btn-expand.is-open { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.06); }

    tr.detail-row td { padding: 0; border-bottom: 1px solid var(--border); }
    tr.detail-row.hidden { display: none; }

    .detail-panel {
      padding: 16px 20px;
      background: rgba(0,0,0,0.25);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .detail-group-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .detail-stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 0; border-bottom: 1px solid rgba(30,39,54,0.5);
      font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
    }
    .detail-stat-row:last-child { border-bottom: none; }
    .detail-stat-label { color: var(--muted); }
    .detail-stat-value { font-weight: 600; color: var(--text); }
    .detail-stat-value.ok  { color: var(--success); }
    .detail-stat-value.bad { color: var(--danger);  }
    .detail-stat-value.mid { color: var(--warn);    }

    /* ── Animations ────────────────────────────────────────────── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 640px) {
      h1          { font-size: 1rem;   }
      .card-value { font-size: 1.5rem; }
      td, th      { padding: 8px 10px; }
    }
  </style>

</head>

  <!-- ============================================================
       JAVASCRIPT  >>>  dashboard.js
       Sections:
         1. State & constants
         2. Mock API  (swap for real fetch)
         3. Charts    (time-series + donut)
         4. Table     (render + sort)
         5. Summary cards
         6. Dashboard render (orchestrator)
         7. Data loading
         8. Init
       ============================================================ -->

  <script>
    'use strict';

    /* ----------------------------------------------------------
       1. STATE & CONSTANTS
       ---------------------------------------------------------- */
    let tsChart     = null;
    let donutChart  = null;
    let currentData = null;
    let currentSort = { col: 'totalReq', dir: 'desc' };

    const AUTO_REFRESH_MS = 60_000;

    const TOOLTIP_DEFAULTS = {
      backgroundColor: '#0d1117',
      borderColor:     '#1e2736',
      borderWidth:     1,
      titleColor:      '#e2e8f0',
      bodyColor:       '#94a3b8',
      titleFont:       { family: 'JetBrains Mono', size: 11 },
      bodyFont:        { family: 'JetBrains Mono', size: 11 },
      padding:         12,
    };

    const TABLE_COLUMNS = [
      { key: 'expand',   label: '',               sortable: false },
      { key: 'endpoint', label: 'ENDPOINT',        sortable: false },
      { key: 'totalReq', label: 'TOTAL REQ',       sortable: true  },
      { key: 'success',  label: '2xx SUCCESS',     sortable: true  },
      { key: 'fail',     label: 'FAILURES',        sortable: true  },
      { key: 'rate',     label: 'SUCCESS RATE',    sortable: true  },
      { key: 'volume',   label: 'VOLUME',          sortable: false },
      { key: 'p99',      label: 'P99 LATENCY',     sortable: true  },
      { key: 'errors',   label: 'ERROR BREAKDOWN', sortable: false },
    ];

    const SORT_KEY_MAP = {
      totalReq: 'total',
      success:  'successCount',
      fail:     'totalFail',
      rate:     'rate',
      p99:      'p99LatencyMs',
    };

    /* ----------------------------------------------------------
       2. MOCK API
       Replace the body of loadData() with a real fetch() call.
       Expected shape: see SECTION 7 comment.
       ---------------------------------------------------------- */
    function mockApiResponse() {
      const now = Date.now();
      const labels = [];
      for (let i = 11; i >= 0; i--) {
        const d = new Date(now - i * 5 * 60 * 1000);
        labels.push(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      }

      const defs = [
        { method: 'GET',    path: '/api/v1/users',        service: 'user-service'    },
        { method: 'POST',   path: '/api/v1/auth/login',   service: 'auth-service'    },
        { method: 'GET',    path: '/api/v1/orders',       service: 'order-service'   },
        { method: 'POST',   path: '/api/v1/payments',     service: 'payment-service' },
        { method: 'GET',    path: '/api/v1/products',     service: 'catalog-service' },
        { method: 'PUT',    path: '/api/v1/users/:id',    service: 'user-service'    },
        { method: 'DELETE', path: '/api/v1/sessions/:id', service: 'auth-service'    },
        { method: 'PATCH',  path: '/api/v1/orders/:id',   service: 'order-service'   },
      ];

      const rnd    = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
      const series = (base, v, n) => Array.from({ length: n }, () => Math.max(0, base + rnd(-v, v)));
      const sum    = arr => arr.reduce((a, b) => a + b, 0);

      const endpoints = defs.map(ep => {
        const s2xx = series(rnd(200, 1200), 80, 12);
        const s4xx = series(rnd(2, 40),     10, 12);
        const s5xx = series(rnd(0, 20),      8, 12);
        const t2xx = sum(s2xx), t4xx = sum(s4xx), t5xx = sum(s5xx);
        return {
          method: ep.method, path: ep.path, service: ep.service,
          successCount: t2xx,
          failureByStatus: {
            '400': rnd(0, Math.floor(t4xx * 0.30)),
            '401': rnd(0, Math.floor(t4xx * 0.20)),
            '403': rnd(0, Math.floor(t4xx * 0.15)),
            '404': rnd(0, Math.floor(t4xx * 0.35)),
            '429': rnd(0, Math.floor(t4xx * 0.10)),
            '500': rnd(0, Math.floor(t5xx * 0.50)),
            '502': rnd(0, Math.floor(t5xx * 0.30)),
            '503': rnd(0, Math.floor(t5xx * 0.20)),
          },
          p99LatencyMs: rnd(45, 850),
          timeSeries: { labels, success: s2xx, fail4xx: s4xx, fail5xx: s5xx },
        };
      });

      const totalSuccess  = endpoints.reduce((a, e) => a + e.successCount, 0);
      const totalFailures = endpoints.reduce((a, e) =>
        a + Object.values(e.failureByStatus).reduce((x, y) => x + y, 0), 0);

      return {
        meta:     { generatedAt: new Date().toISOString(), window: '1h', resolution: '5m' },
        summary:  { totalRequests: totalSuccess + totalFailures, totalSuccess, totalFailures,
                    p99LatencyMs: Math.max(...endpoints.map(e => e.p99LatencyMs)),
                    activeEndpoints: endpoints.length },
        timeSeries: { labels },
        endpoints,
      };
    }

    /* ----------------------------------------------------------
       3. CHARTS
       ---------------------------------------------------------- */
    function aggregateSeries(endpoints, field) {
      return endpoints.reduce((acc, ep) => {
        ep.timeSeries[field].forEach((v, i) => { acc[i] = (acc[i] || 0) + v; });
        return acc;
      }, []);
    }

    function buildTimeSeriesChart(data) {
      if (tsChart) tsChart.destroy();
      const ctx = document.getElementById('tsCanvas').getContext('2d');
      const axis = {
        grid:   { color: 'rgba(30,39,54,0.8)', drawTicks: false },
        ticks:  { color: '#475569', font: { family: 'JetBrains Mono', size: 10 } },
        border: { color: '#1e2736' },
      };
      tsChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.timeSeries.labels,
          datasets: [
            { label: '2xx Success',
              data: aggregateSeries(data.endpoints, 'success'),
              borderColor: '#00c896', backgroundColor: 'rgba(0,200,150,0.08)',
              fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2 },
            { label: '4xx Client Errors',
              data: aggregateSeries(data.endpoints, 'fail4xx'),
              borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.06)',
              fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2 },
            { label: '5xx Server Errors',
              data: aggregateSeries(data.endpoints, 'fail5xx'),
              borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.06)',
              fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: { duration: 600 },
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { display: false }, tooltip: TOOLTIP_DEFAULTS },
          scales: { x: { ...axis, ticks: { ...axis.ticks, maxTicksLimit: 6 } }, y: axis },
        },
      });
    }

    function buildDonutChart(data) {
      if (donutChart) donutChart.destroy();
      const ctx = document.getElementById('donutCanvas').getContext('2d');

      const agg = {};
      data.endpoints.forEach(ep =>
        Object.entries(ep.failureByStatus).forEach(([code, count]) => {
          agg[code] = (agg[code] || 0) + count;
        })
      );

      const sorted = Object.entries(agg).filter(([, v]) => v > 0).sort(([, a], [, b]) => b - a);
      const pal4   = ['#f59e0b','#fb923c','#fbbf24','#fde68a','#fdba74'];
      const pal5   = ['#ef4444','#f87171','#dc2626','#b91c1c','#fca5a5'];
      const colors = sorted.map(([code], i) =>
        parseInt(code) >= 500 ? pal5[i % pal5.length] : pal4[i % pal4.length]);

      donutChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels:   sorted.map(([code]) => `HTTP ${code}`),
          datasets: [{ data: sorted.map(([, v]) => v), backgroundColor: colors, borderColor: '#0d1117', borderWidth: 3, hoverOffset: 6 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%', animation: { duration: 600 },
          plugins: {
            legend: { position: 'right', labels: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 }, boxWidth: 10, padding: 12 } },
            tooltip: { ...TOOLTIP_DEFAULTS, padding: 10 },
          },
        },
      });
    }

    /* ----------------------------------------------------------
       4. TABLE
       ---------------------------------------------------------- */

    // Exposed globally so onclick="toggleDetail(...)" in dynamic HTML works
    function toggleDetail(id) {
      const detailRow = document.getElementById('detail-' + id);
      const btn       = document.getElementById('btn-' + id);
      if (!detailRow || !btn) return;
      const isOpen = !detailRow.classList.contains('hidden');
      detailRow.classList.toggle('hidden', isOpen);
      btn.classList.toggle('is-open', !isOpen);
      btn.textContent = isOpen ? '▸' : '▾';
    }

    // Exposed globally so onclick="sortTable(...)" in dynamic HTML works
    function sortTable(col) {
      currentSort = currentSort.col === col
        ? { col, dir: currentSort.dir === 'asc' ? 'desc' : 'asc' }
        : { col, dir: 'desc' };
      document.getElementById('tableContainer').innerHTML = renderTable(currentData);
    }

    function renderTable(data) {
      const sumObj = obj => Object.values(obj).reduce((a, b) => a + b, 0);

      // Enrich rows with computed fields
      const rows = data.endpoints.map(ep => {
        const totalFail = sumObj(ep.failureByStatus);
        const total     = ep.successCount + totalFail;
        const rate      = total > 0 ? (ep.successCount / total * 100) : 100;
        return { ...ep, totalFail, total, rate };
      });

      // Apply sort
      const dir    = currentSort.dir === 'asc' ? 1 : -1;
      const sortBy = SORT_KEY_MAP[currentSort.col] || 'total';
      rows.sort((a, b) => (a[sortBy] - b[sortBy]) * dir);

      const maxReq = Math.max(...rows.map(r => r.total));

      // Build <thead>
      const thead = TABLE_COLUMNS.map(c => {
        const cls     = c.sortable && currentSort.col === c.key ? `sort-${currentSort.dir}` : '';
        const onclick = c.sortable ? `onclick="sortTable('${c.key}')"` : '';
        return `<th class="${cls}" ${onclick}>${c.label}</th>`;
      }).join('');

      // Build <tbody>
      const tbody = rows.map((r, i) => {
        const rateCls  = r.rate >= 99 ? 'rate-high' : r.rate >= 95 ? 'rate-mid' : 'rate-low';
        const pct      = maxReq > 0 ? (r.total / maxReq * 100).toFixed(1) : 0;
        const barColor = r.rate >= 99 ? 'var(--success)' : r.rate >= 95 ? 'var(--warn)' : 'var(--danger)';
        const badges   = Object.entries(r.failureByStatus)
          .filter(([, v]) => v > 0)
          .sort(([, a], [, b]) => b - a)
          .slice(0, 4)
          .map(([code, cnt]) =>
            `<span class="err-badge ${parseInt(code) >= 500 ? 'err-5xx' : 'err-4xx'}">${code}: ${cnt.toLocaleString()}</span>`)
          .join('');

        // Detail panel: per-bucket time-series stats + full status code breakdown
        const totalFail5xx = Object.entries(r.failureByStatus)
          .filter(([code]) => parseInt(code) >= 500)
          .reduce((a, [, v]) => a + v, 0);
        const totalFail4xx = r.totalFail - totalFail5xx;
        const avgSuccess   = Math.round(r.timeSeries.success.reduce((a,b)=>a+b,0) / r.timeSeries.success.length);
        const peakSuccess  = Math.max(...r.timeSeries.success);
        const allStatusRows = Object.entries(r.failureByStatus)
          .filter(([, v]) => v > 0)
          .sort(([a], [b]) => parseInt(a) - parseInt(b))
          .map(([code, cnt]) => {
            const cls = parseInt(code) >= 500 ? 'bad' : 'mid';
            return `<div class="detail-stat-row">
              <span class="detail-stat-label">HTTP ${code}</span>
              <span class="detail-stat-value ${cls}">${cnt.toLocaleString()}</span>
            </div>`;
          }).join('');

        const colSpan = TABLE_COLUMNS.length;

        return `
          <tr style="animation-delay:${i * 30}ms">
            <td style="width:36px;text-align:center">
              <button class="btn-expand" id="btn-${i}" onclick="toggleDetail(${i})">▸</button>
            </td>
            <td>
              <div class="endpoint-cell">
                <div>
                  <span class="method-badge method-${r.method}">${r.method}</span>
                  <span class="endpoint-path">${r.path}</span>
                </div>
                <div class="endpoint-svc">${r.service}</div>
              </div>
            </td>
            <td class="num">${r.total.toLocaleString()}</td>
            <td class="num num-success">${r.successCount.toLocaleString()}</td>
            <td class="num num-fail">${r.totalFail.toLocaleString()}</td>
            <td><span class="rate-pill ${rateCls}">${r.rate.toFixed(2)}%</span></td>
            <td class="bar-cell">
              <div class="bar-track">
                <div class="bar-fill" style="width:${pct}%;background:${barColor}"></div>
              </div>
              <div class="bar-pct">${pct}%</div>
            </td>
            <td class="p99-cell">${r.p99LatencyMs} ms</td>
            <td>
              <div class="err-badges">
                ${badges || '<span style="color:var(--muted);font-size:0.65rem">—</span>'}
              </div>
            </td>
          </tr>
          <tr class="detail-row hidden" id="detail-${i}">
            <td colspan="${colSpan}">
              <div class="detail-panel">
                <div>
                  <div class="detail-group-title">Traffic Summary</div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Total Requests</span><span class="detail-stat-value">${r.total.toLocaleString()}</span></div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Success (2xx)</span><span class="detail-stat-value ok">${r.successCount.toLocaleString()}</span></div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Client Errors (4xx)</span><span class="detail-stat-value mid">${totalFail4xx.toLocaleString()}</span></div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Server Errors (5xx)</span><span class="detail-stat-value bad">${totalFail5xx.toLocaleString()}</span></div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Success Rate</span><span class="detail-stat-value ${r.rate >= 99 ? 'ok' : r.rate >= 95 ? 'mid' : 'bad'}">${r.rate.toFixed(3)}%</span></div>
                </div>
                <div>
                  <div class="detail-group-title">Throughput (5m buckets)</div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Avg Success / bucket</span><span class="detail-stat-value">${avgSuccess.toLocaleString()}</span></div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Peak Success / bucket</span><span class="detail-stat-value ok">${peakSuccess.toLocaleString()}</span></div>
                  <div class="detail-stat-row"><span class="detail-stat-label">P99 Latency</span><span class="detail-stat-value mid">${r.p99LatencyMs} ms</span></div>
                  <div class="detail-stat-row"><span class="detail-stat-label">Service</span><span class="detail-stat-value">${r.service}</span></div>
                </div>
                <div>
                  <div class="detail-group-title">Error Breakdown</div>
                  ${allStatusRows || '<div class="detail-stat-row"><span class="detail-stat-label" style="color:var(--success)">No errors recorded</span></div>'}
                </div>
              </div>
            </td>
          </tr>`;
      }).join('');

      return `
        <div class="table-wrap">
          <table>
            <thead><tr>${thead}</tr></thead>
            <tbody>${tbody}</tbody>
          </table>
        </div>`;
    }

    /* ----------------------------------------------------------
       5. SUMMARY CARDS
       ---------------------------------------------------------- */
    function renderSummary(s) {
      const fmt = n => n.toLocaleString();
      const pct = (n, d) => d > 0 ? (n / d * 100).toFixed(2) : '0.00';
      const cards = [
        { label: 'TOTAL REQUESTS', value: fmt(s.totalRequests),  sub: 'last 60 minutes',                                          accent: 'var(--accent)'  },
        { label: 'SUCCESSFUL',     value: fmt(s.totalSuccess),   sub: `${pct(s.totalSuccess,  s.totalRequests)}% success rate`,   accent: 'var(--success)' },
        { label: 'FAILURES',       value: fmt(s.totalFailures),  sub: `${pct(s.totalFailures, s.totalRequests)}% error rate`,     accent: 'var(--danger)'  },
        { label: 'P99 LATENCY',    value: `${s.p99LatencyMs}ms`, sub: 'worst endpoint',                                           accent: 'var(--warn)'    },
        { label: 'ENDPOINTS',      value: s.activeEndpoints,     sub: 'instrumented routes',                                      accent: '#a78bfa'        },
      ];
      return `<div class="summary-grid">
        ${cards.map(c => `
          <div class="summary-card" style="--card-accent:${c.accent}">
            <div class="card-label">${c.label}</div>
            <div class="card-value">${c.value}</div>
            <div class="card-sub">${c.sub}</div>
          </div>`).join('')}
      </div>`;
    }

    /* ----------------------------------------------------------
       6. DASHBOARD RENDER  (orchestrator)
       ---------------------------------------------------------- */
    function renderDashboard(data) {
      document.getElementById('mainContent').innerHTML = `
        ${renderSummary(data.summary)}

        <div class="controls-row">
          <div class="section-title">Request Volume <span>over time</span></div>
          <div class="time-range-tabs">
            <button class="tab active">1H</button>
            <button class="tab">6H</button>
            <button class="tab">24H</button>
            <button class="tab">7D</button>
          </div>
        </div>

        <div class="chart-grid">
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">Request Volume · Time Series</div>
              <div class="panel-badge">5m resolution</div>
            </div>
            <div class="chart-wrap"><canvas id="tsCanvas"></canvas></div>
            <div class="chart-legend">
              <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div>2xx Success</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--warn)"></div>4xx Client Errors</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>5xx Server Errors</div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">Error Distribution</div>
              <div class="panel-badge">by status code</div>
            </div>
            <div class="chart-wrap"><canvas id="donutCanvas"></canvas></div>
          </div>
        </div>

        <div class="controls-row" style="margin-top:8px">
          <div class="section-title">Endpoint Breakdown <span>${data.endpoints.length} routes</span></div>
        </div>

        <div class="panel" style="padding:0;overflow:hidden">
          <div id="tableContainer">${renderTable(data)}</div>
        </div>
      `;

      // Tab switching — extend to pass the chosen window to loadData()
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
        });
      });

      buildTimeSeriesChart(data);
      buildDonutChart(data);
    }

    /* ----------------------------------------------------------
       7. DATA LOADING
       To connect a real backend replace the two mock lines with:

         const res  = await fetch('/metrics/volumetrics?window=1h&resolution=5m');
         if (!res.ok) throw new Error(`HTTP ${res.status}`);
         const data = await res.json();

       Expected API response shape:
       {
         meta:     { generatedAt, window, resolution }
         summary:  { totalRequests, totalSuccess, totalFailures, p99LatencyMs, activeEndpoints }
         timeSeries: { labels: string[] }
         endpoints: [{
           method, path, service,
           successCount,
           failureByStatus: { "4xx"|"5xx" code: count },
           p99LatencyMs,
           timeSeries: { labels, success[], fail4xx[], fail5xx[] }
         }]
       }
       ---------------------------------------------------------- */
    async function loadData() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      try {
        await new Promise(r => setTimeout(r, 600)); // simulate latency — remove for real API
        const data = mockApiResponse();              // ← swap with real fetch()

        currentData = data;
        renderDashboard(data);

        const ts = new Date(data.meta.generatedAt);
        document.getElementById('lastUpdated').textContent =
          'Updated ' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      } catch (err) {
        document.getElementById('mainContent').innerHTML = `
          <div class="state-overlay">
            <div class="error-icon">⚠</div>
            <div style="color:var(--danger)">Failed to load metrics</div>
            <div style="color:var(--muted);font-size:0.68rem">${err.message}</div>
            <button class="retry-btn" onclick="loadData()">↺ Retry</button>
          </div>`;
      } finally {
        btn.classList.remove('spinning');
      }
    }

    /* ----------------------------------------------------------
       8. INIT
       ---------------------------------------------------------- */
    loadData();
    setInterval(loadData, AUTO_REFRESH_MS);
  </script>

</body>
</html>
