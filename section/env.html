<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EnvPulse — Microservice Environment Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
/* ============================================================
   EnvPulse — Microservice Environment Dashboard
   env-dashboard.css
   ============================================================ */

/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Design Tokens ──────────────────────────────────────── */
:root {
  --bg:       #060810;
  --surface:  #0d1117;
  --surface2: #111720;
  --surface3: #0a0e18;
  --border:   #1e2736;
  --border2:  #263142;
  --accent:   #00e5ff;
  --accent2:  #7c3aed;
  --success:  #00c896;
  --warn:     #f59e0b;
  --danger:   #ef4444;
  --critical: #ff3d71;
  --text:     #e2e8f0;
  --muted:    #64748b;
  --glow:     0 0 20px rgba(0,229,255,0.15);

  /* env accent colours */
  --dev:  #00e5ff;
  --sit:  #a78bfa;
  --uat:  #f59e0b;
  --rtb:  #fb923c;
  --prod: #00c896;
}

/* ── Base ───────────────────────────────────────────────── */
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.016) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none; z-index: 0;
}

/* ── Layout ─────────────────────────────────────────────── */
.page-wrapper {
  position: relative; z-index: 1;
  max-width: 1700px; margin: 0 auto;
  padding: 0 28px 56px;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  flex-wrap: wrap; gap: 12px;
}
.header-left  { display: flex; align-items: center; gap: 12px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-divider { width:1px; height:26px; background:var(--border); flex-shrink:0; }

.logo-mark {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  color: #000; box-shadow: var(--glow); flex-shrink: 0;
}
h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.header-subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; color: var(--muted); margin-top: 2px;
}

/* ── Live indicator ─────────────────────────────────────── */
.live-pill {
  display: flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  padding: 5px 12px; border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--muted);
}
.live-pill .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 6px var(--success);
  animation: livepulse 2s infinite;
}
.live-pill.polling .dot { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
@keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.last-updated {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.63rem; color: var(--muted); white-space: nowrap;
}

/* ── Buttons ────────────────────────────────────────────── */
.btn-refresh {
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  padding: 5px 13px; border-radius: 6px;
  border: 1px solid var(--accent); background: transparent; color: var(--accent);
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em;
}
.btn-refresh:hover    { background: rgba(0,229,255,0.08); box-shadow: var(--glow); }
.btn-refresh.spinning { opacity: 0.45; pointer-events: none; }

.btn-stop {
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  padding: 5px 13px; border-radius: 6px;
  border: 1px solid var(--warn); background: transparent; color: var(--warn);
  cursor: pointer; transition: all 0.2s;
}
.btn-stop:hover { background: rgba(245,158,11,0.08); }

/* ── Interval select ────────────────────────────────────── */
.filter-group { display: flex; flex-direction: column; gap: 3px; }
.filter-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.56rem; letter-spacing: 0.1em;
  color: var(--muted); text-transform: uppercase;
}
.filter-select {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; padding: 5px 10px;
  outline: none; cursor: pointer;
}
.filter-select:focus { border-color: var(--accent); }

/* ── Summary Strip ──────────────────────────────────────── */
.summary-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 10px; margin-bottom: 18px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 13px 16px;
  position: relative; overflow: hidden;
  transition: border-color 0.2s, transform 0.2s;
}
.stat-card:hover { border-color: var(--card-color, var(--accent)); transform: translateY(-1px); }
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--card-color, var(--accent));
}
.stat-label {
  font-family: 'JetBrains Mono', monospace; font-size: 0.57rem;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.stat-value { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--card-color, var(--accent)); }
.stat-sub   { font-size: 0.63rem; color: var(--muted); margin-top: 3px; }

/* ── Search ─────────────────────────────────────────────── */
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px; margin-bottom: 16px;
}
.search-bar input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
}
.search-bar input::placeholder { color: var(--muted); }
.si { color: var(--muted); font-size: 0.9rem; }

/* ── Group Tabs ─────────────────────────────────────────── */
.group-tabs-wrap {
  display: flex; align-items: center; gap: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 4px;
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.group-tabs-wrap::-webkit-scrollbar { display: none; }

.group-tab {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  padding: 7px 16px; border-radius: 7px;
  border: none; background: transparent;
  color: var(--muted); cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
  letter-spacing: 0.03em;
}
.group-tab:hover { color: var(--text); }
.group-tab.active {
  background: var(--surface2);
  color: var(--accent);
  border: 1px solid var(--border2);
}
.tab-count {
  font-size: 0.6rem; padding: 1px 6px; border-radius: 3px;
  background: var(--border); color: var(--muted);
  font-weight: 700;
}
.group-tab.active .tab-count {
  background: rgba(0,229,255,0.12); color: var(--accent);
}

/* ── Environment header strip ───────────────────────────── */
.env-header-strip {
  display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;
}
.env-legend-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; font-weight: 700;
  padding: 3px 10px; border-radius: 4px;
  border: 1px solid; letter-spacing: 0.04em;
}
.env-dev  { background: rgba(0,229,255,0.07);  border-color: rgba(0,229,255,0.25);  color: var(--dev);  }
.env-sit  { background: rgba(167,139,250,0.07); border-color: rgba(167,139,250,0.3); color: var(--sit);  }
.env-uat  { background: rgba(245,158,11,0.07); border-color: rgba(245,158,11,0.25); color: var(--uat);  }
.env-rtb  { background: rgba(251,146,60,0.07); border-color: rgba(251,146,60,0.25); color: var(--rtb);  }
.env-prod { background: rgba(0,200,150,0.07);  border-color: rgba(0,200,150,0.25);  color: var(--prod); }

/* ── Service Table ──────────────────────────────────────── */
.svc-table-wrap { overflow-x: auto; }

.svc-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 4px;
}

/* thead */
.svc-table thead tr th {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.57rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  padding: 8px 14px;
  background: transparent;
  border-bottom: 1px solid var(--border);
  white-space: nowrap; text-align: left;
}
.svc-table thead tr th.env-col { text-align: center; }
.svc-table thead tr th.env-col-dev  { color: var(--dev);  }
.svc-table thead tr th.env-col-sit  { color: var(--sit);  }
.svc-table thead tr th.env-col-uat  { color: var(--uat);  }
.svc-table thead tr th.env-col-rtb  { color: var(--rtb);  }
.svc-table thead tr th.env-col-prod { color: var(--prod); }

/* tbody rows */
.svc-table tbody tr td {
  padding: 10px 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.svc-table tbody tr td:first-child {
  border-left: 1px solid var(--border);
  border-radius: 8px 0 0 8px;
  border-left-width: 3px;
}
.svc-table tbody tr td:last-child {
  border-right: 1px solid var(--border);
  border-radius: 0 8px 8px 0;
}
.svc-table tbody tr:hover td { background: var(--surface2); }

/* Left accent bar on row by overall health */
.svc-table tbody tr.row-healthy td:first-child  { border-left-color: var(--success); }
.svc-table tbody tr.row-degraded td:first-child  { border-left-color: var(--warn); }
.svc-table tbody tr.row-down td:first-child      { border-left-color: var(--danger); }
.svc-table tbody tr.row-unknown td:first-child   { border-left-color: var(--border2); }

/* ── Service name cell ──────────────────────────────────── */
.svc-name-cell { min-width: 200px; }
.svc-name {
  font-weight: 600; font-size: 0.82rem; color: var(--text);
  white-space: nowrap;
}
.svc-group-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem; color: var(--muted); margin-top: 2px;
}

/* ── Overall health badge ───────────────────────────────── */
.overall-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; font-weight: 700;
  padding: 3px 8px; border-radius: 5px;
  display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap;
}
.badge-healthy  { background: rgba(0,200,150,0.1);  color: var(--success); border: 1px solid rgba(0,200,150,0.25); }
.badge-degraded { background: rgba(245,158,11,0.1); color: var(--warn);    border: 1px solid rgba(245,158,11,0.25); }
.badge-down     { background: rgba(239,68,68,0.1);  color: var(--danger);  border: 1px solid rgba(239,68,68,0.25); }
.badge-unknown  { background: rgba(100,116,139,0.1);color: var(--muted);   border: 1px solid rgba(100,116,139,0.2); }
.badge-dot      { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-healthy .badge-dot  { animation: livepulse 2s infinite; }
.badge-degraded .badge-dot { animation: livepulse 1.5s infinite; }

/* ── Environment instance column ────────────────────────── */
.env-col { min-width: 100px; text-align: center; }

.instance-stack {
  display: flex; flex-direction: column; gap: 5px;
  align-items: center; justify-content: center;
}

.instance-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; padding: 3px 8px;
  border-radius: 5px; border: 1px solid;
  white-space: nowrap; cursor: pointer;
  transition: all 0.15s;
  position: relative;
}

/* instance health states */
.inst-up {
  background: rgba(0,200,150,0.07);
  border-color: rgba(0,200,150,0.3);
  color: var(--success);
}
.inst-up:hover { background: rgba(0,200,150,0.15); }

.inst-down {
  background: rgba(239,68,68,0.08);
  border-color: rgba(239,68,68,0.35);
  color: var(--danger);
}
.inst-down:hover { background: rgba(239,68,68,0.15); }

.inst-checking {
  background: rgba(245,158,11,0.07);
  border-color: rgba(245,158,11,0.3);
  color: var(--warn);
}

.inst-unknown {
  background: rgba(100,116,139,0.07);
  border-color: rgba(100,116,139,0.2);
  color: var(--muted);
}

/* status dot inside chip */
.inst-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.inst-up .inst-dot { animation: livepulse 2s infinite; }
.inst-checking .inst-dot { animation: spin 1s linear infinite; border-radius: 0; width: 8px; height: 8px; border: 1.5px solid currentColor; border-top-color: transparent; background: transparent; }

.env-none { color: var(--border2); font-size: 0.9rem; }

/* ── Tooltip ─────────────────────────────────────────────── */
.tooltip-wrap { position: relative; display: inline-flex; }
.tooltip-box {
  display: none;
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 7px 10px;
  white-space: nowrap; z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  pointer-events: none;
}
.tooltip-wrap:hover .tooltip-box { display: block; }
.tooltip-name { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text); font-weight: 600; margin-bottom: 3px; }
.tooltip-url  { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); }
.tooltip-status { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; margin-top: 3px; }
.tooltip-ok  { color: var(--success); }
.tooltip-err { color: var(--danger);  }
.tooltip-chk { color: var(--warn);    }

/* ── Empty / Loading / Error states ─────────────────────── */
.state-overlay {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 280px; gap: 12px;
  color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.74rem;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
.retry-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  padding: 5px 14px; border-radius: 6px;
  border: 1px solid var(--danger); background: transparent; color: var(--danger); cursor: pointer;
}
.retry-btn:hover { background: rgba(239,68,68,0.08); }

/* ── Table container panel ──────────────────────────────── */
.table-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.table-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 8px;
}
.toolbar-title { font-size: 0.8rem; font-weight: 600; color: var(--text); }
.toolbar-title span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; color: var(--muted); font-weight: 400; margin-left: 8px;
}

/* ── Animations ─────────────────────────────────────────── */
@keyframes spin     { to { transform: rotate(360deg); } }
@keyframes rowIn    { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
.svc-table tbody tr { animation: rowIn 0.25s ease both; }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 768px) {
  .page-wrapper { padding: 0 12px 36px; }
  h1 { font-size: 1rem; }
  .stat-value { font-size: 1.35rem; }
}
  </style>
</head>
<body>
<div class="page-wrapper">

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="logo-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <h1>Env<span>Pulse</span></h1>
        <div class="header-subtitle">microservice health · environment monitor</div>
      </div>
    </div>
    <div class="header-right">
      <!-- Live pill -->
      <div class="live-pill" id="livePill">
        <span class="dot"></span><span id="liveLabel">LIVE</span>
      </div>

      <!-- Poll interval -->
      <div class="filter-group">
        <label class="filter-label" for="intervalSelect">POLL EVERY</label>
        <select id="intervalSelect" class="filter-select">
          <option value="15000">15 s</option>
          <option value="30000" selected>30 s</option>
          <option value="60000">60 s</option>
          <option value="120000">2 min</option>
          <option value="300000">5 min</option>
        </select>
      </div>

      <div class="header-divider"></div>
      <div class="last-updated" id="lastUpdated">—</div>

      <!-- Poll toggle -->
      <button class="btn-refresh" id="pollToggleBtn" onclick="togglePolling()">⏸ Stop</button>
      <!-- Manual refresh (re-fetches registry) -->
      <button class="btn-refresh" id="refreshBtn" onclick="loadData()">⟳ Reload</button>
    </div>
  </header>

  <!-- Summary cards -->
  <div class="summary-strip" id="summaryStrip"></div>

  <!-- Search -->
  <div class="search-bar">
    <span class="si">⌕</span>
    <input type="text" placeholder="Search service name or group…" oninput="onSearch(this.value)"/>
  </div>

  <!-- Group tabs -->
  <div class="group-tabs-wrap" id="groupTabs">
    <!-- populated by JS -->
  </div>

  <!-- Env legend -->
  <div class="env-header-strip">
    <span class="env-legend-chip env-dev">DEV</span>
    <span class="env-legend-chip env-sit">SIT</span>
    <span class="env-legend-chip env-uat">UAT</span>
    <span class="env-legend-chip env-rtb">RTB</span>
    <span class="env-legend-chip env-prod">PROD</span>
  </div>

  <!-- Table panel -->
  <div id="tablePanel" class="table-panel">
    <div class="state-overlay">
      <div class="spinner"></div>
      <div>Loading service registry…</div>
    </div>
  </div>

</div>
<script>
/* ============================================================
   EnvPulse — Microservice Environment Dashboard
   env-dashboard.js

   Sections:
     1. State & constants
     2. Mock registry API      ← swap for real fetch
     3. Health polling engine
     4. Utilities
     5. Summary strip
     6. Group tabs
     7. Service table renderer
     8. Filters & search
     9. Data loading & init
   ============================================================ */
'use strict';

/* ----------------------------------------------------------
   1. STATE & CONSTANTS
   ---------------------------------------------------------- */
/** Full registry of services from the server API */
let registry       = [];
/** health map: key = `${serviceId}:${env}:${instanceName}` → { status, latencyMs, checkedAt, error } */
const healthMap    = {};
/** Currently selected group tab */
let activeGroup    = '__ALL__';
/** Live search query */
let searchQuery    = '';
/** Polling interval handle */
let pollHandle     = null;
/** Are we currently polling? */
let polling        = false;

const ENV_ORDER = ['dev', 'sit', 'uat', 'rtb', 'prod'];
const ENV_COLOR = { dev:'var(--dev)', sit:'var(--sit)', uat:'var(--uat)', rtb:'var(--rtb)', prod:'var(--prod)' };
const ENV_CLS   = { dev:'env-dev',  sit:'env-sit',  uat:'env-uat',  rtb:'env-rtb',  prod:'env-prod' };

/* ----------------------------------------------------------
   2. MOCK REGISTRY API
   ──────────────────────────────────────────────────────────
   In production replace mockRegistryResponse() with:

     const res = await fetch('/api/services/registry');
     if (!res.ok) throw new Error(`HTTP ${res.status}`);
     return await res.json();

   Expected response shape:
   {
     meta: { fetchedAt: ISO string }
     services: [{
       id:           string,         // unique key
       apiName:      string,         // display name
       apiGroup:     string,         // tab grouping
       instances: [{
         env:          string,       // 'dev'|'sit'|'uat'|'rtb'|'prod'
         instanceName: string,       // e.g. "dev-1", "sit-b"
         healthUrl:    string,       // GET → 200 means healthy
       }]
     }]
   }
   ---------------------------------------------------------- */
function mockRegistryResponse() {
  const svcDefs = [
    /* ── Identity & Access ──────────────────────────────── */
    { id:'iam-auth',    name:'auth-service',          group:'Identity & Access' },
    { id:'iam-user',    name:'user-management-api',   group:'Identity & Access' },
    { id:'iam-role',    name:'role-permission-api',   group:'Identity & Access' },
    /* ── Payments ───────────────────────────────────────── */
    { id:'pay-gateway', name:'payment-gateway-api',   group:'Payments' },
    { id:'pay-wallet',  name:'wallet-service',        group:'Payments' },
    { id:'pay-fraud',   name:'fraud-detection-api',   group:'Payments' },
    { id:'pay-settle',  name:'settlement-service',    group:'Payments' },
    /* ── Orders ─────────────────────────────────────────── */
    { id:'ord-core',    name:'order-core-api',        group:'Orders' },
    { id:'ord-basket',  name:'basket-service',        group:'Orders' },
    { id:'ord-pricing', name:'pricing-engine-api',    group:'Orders' },
    /* ── Notifications ──────────────────────────────────── */
    { id:'notif-email', name:'email-notification-svc',group:'Notifications' },
    { id:'notif-sms',   name:'sms-gateway-api',       group:'Notifications' },
    { id:'notif-push',  name:'push-notification-svc', group:'Notifications' },
    /* ── Platform ───────────────────────────────────────── */
    { id:'plat-config', name:'config-service',        group:'Platform' },
    { id:'plat-audit',  name:'audit-log-api',         group:'Platform' },
    { id:'plat-search', name:'search-service',        group:'Platform' },
    { id:'plat-media',  name:'media-asset-api',       group:'Platform' },
  ];

  // Each service gets a different spread of environments & instances
  const envProfiles = [
    { dev:2, sit:2, uat:1, rtb:1, prod:2 },
    { dev:1, sit:2, uat:1, rtb:0, prod:2 },
    { dev:1, sit:1, uat:1, rtb:1, prod:1 },
    { dev:2, sit:3, uat:2, rtb:1, prod:3 },
    { dev:1, sit:2, uat:0, rtb:0, prod:1 },
  ];
  const suffixes = ['1','2','3','a','b','c','x'];

  const services = svcDefs.map((s, i) => {
    const profile   = envProfiles[i % envProfiles.length];
    const instances = [];
    ENV_ORDER.forEach(env => {
      const count = profile[env] || 0;
      for (let n = 0; n < count; n++) {
        instances.push({
          env,
          instanceName: `${env}-${suffixes[n]}`,
          healthUrl: `https://internal.api/${env}/${s.id}/${suffixes[n]}/health`,
        });
      }
    });
    return { id: s.id, apiName: s.name, apiGroup: s.group, instances };
  });

  return { meta: { fetchedAt: new Date().toISOString() }, services };
}

/* ----------------------------------------------------------
   3. HEALTH POLLING ENGINE
   ──────────────────────────────────────────────────────────
   In production:
   - Replace simulateHealthCheck() with a real fetch() to each healthUrl
   - OR hit a backend aggregator endpoint that batches all health checks
     and returns the healthMap object directly (recommended for CORS)
   ---------------------------------------------------------- */

/**
 * Simulates a health check. Replace with:
 *   const t0  = Date.now();
 *   const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
 *   return { ok: res.ok, latencyMs: Date.now() - t0 };
 */
async function simulateHealthCheck(url) {
  // randomise a realistic latency and occasional failures
  const latency = 30 + Math.floor(Math.random() * 280);
  await new Promise(r => setTimeout(r, latency));
  const rand = Math.random();
  if (rand < 0.06)  return { ok: false, latencyMs: latency, error: 'Connection refused' };
  if (rand < 0.10)  return { ok: false, latencyMs: latency, error: 'Timeout' };
  return { ok: true, latencyMs: latency };
}

/** Run a single health check and update the healthMap */
async function checkInstance(serviceId, env, instanceName, healthUrl) {
  const key = `${serviceId}:${env}:${instanceName}`;
  healthMap[key] = { status: 'checking', latencyMs: null, checkedAt: null, error: null };

  try {
    const result = await simulateHealthCheck(healthUrl);
    healthMap[key] = {
      status:    result.ok ? 'up' : 'down',
      latencyMs: result.latencyMs,
      checkedAt: new Date().toISOString(),
      error:     result.error || null,
    };
  } catch (err) {
    healthMap[key] = { status: 'down', latencyMs: null, checkedAt: new Date().toISOString(), error: err.message };
  }
}

/** Poll all instances concurrently, then re-render */
async function pollAll() {
  if (!registry.length) return;
  document.getElementById('livePill').classList.add('polling');

  const checks = registry.flatMap(svc =>
    svc.instances.map(inst =>
      checkInstance(svc.id, inst.env, inst.instanceName, inst.healthUrl)
    )
  );

  await Promise.allSettled(checks);

  document.getElementById('livePill').classList.remove('polling');
  document.getElementById('lastUpdated').textContent =
    'Checked ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });

  renderSummary(registry);
  renderActiveGroup();
}

function startPolling(intervalMs) {
  stopPolling();
  polling = true;
  updatePollControls();
  pollAll(); // immediate first run
  pollHandle = setInterval(pollAll, intervalMs);
}

function stopPolling() {
  if (pollHandle) clearInterval(pollHandle);
  pollHandle = null;
  polling = false;
  updatePollControls();
}

function togglePolling() {
  if (polling) { stopPolling(); } else { startPolling(getIntervalMs()); }
}

function getIntervalMs() {
  return parseInt(document.getElementById('intervalSelect').value, 10) || 30000;
}

function updatePollControls() {
  const pill = document.getElementById('livePill');
  const btn  = document.getElementById('pollToggleBtn');
  if (polling) {
    pill.querySelector('.dot').style.background = '';
    btn.textContent = '⏸ Stop';
    btn.className   = 'btn-stop';
  } else {
    pill.querySelector('.dot').style.background = 'var(--muted)';
    btn.textContent = '▶ Poll';
    btn.className   = 'btn-refresh';
  }
}

/* ----------------------------------------------------------
   4. UTILITIES
   ---------------------------------------------------------- */
function healthKey(serviceId, env, instanceName) {
  return `${serviceId}:${env}:${instanceName}`;
}

function getHealth(serviceId, env, instanceName) {
  return healthMap[healthKey(serviceId, env, instanceName)] || { status: 'unknown' };
}

/** Compute overall row health from all instances */
function rowHealth(svc) {
  const statuses = svc.instances.map(i => getHealth(svc.id, i.env, i.instanceName).status);
  if (statuses.every(s => s === 'unknown' || s === 'checking')) return 'unknown';
  if (statuses.some(s => s === 'down'))     return statuses.every(s => s === 'down') ? 'down' : 'degraded';
  if (statuses.some(s => s === 'checking')) return 'degraded';
  return 'healthy';
}

function rowHealthCls(h) {
  return { healthy:'row-healthy', degraded:'row-degraded', down:'row-down', unknown:'row-unknown' }[h] || 'row-unknown';
}

function overallBadgeHtml(h) {
  const map = {
    healthy:  `<span class="overall-badge badge-healthy"><span class="badge-dot"></span>Healthy</span>`,
    degraded: `<span class="overall-badge badge-degraded"><span class="badge-dot"></span>Degraded</span>`,
    down:     `<span class="overall-badge badge-down"><span class="badge-dot"></span>Down</span>`,
    unknown:  `<span class="overall-badge badge-unknown"><span class="badge-dot"></span>Unknown</span>`,
  };
  return map[h] || map.unknown;
}

/* ----------------------------------------------------------
   5. SUMMARY STRIP
   ---------------------------------------------------------- */
function renderSummary(services) {
  const allInst    = services.flatMap(s => s.instances.map(i => getHealth(s.id, i.env, i.instanceName)));
  const total      = allInst.length;
  const up         = allInst.filter(h => h.status === 'up').length;
  const down       = allInst.filter(h => h.status === 'down').length;
  const checking   = allInst.filter(h => h.status === 'checking').length;
  const pct        = total ? Math.round((up / total) * 100) : 0;

  // Group-level health for prod
  const prodInst   = services.flatMap(s => s.instances.filter(i => i.env === 'prod').map(i => getHealth(s.id, i.env, i.instanceName)));
  const prodDown   = prodInst.filter(h => h.status === 'down').length;

  const cards = [
    { label:'TOTAL SERVICES',  value: services.length,        sub:'registered',                    color:'var(--accent)'  },
    { label:'TOTAL INSTANCES', value: total,                  sub:'across all envs',               color:'#818cf8'        },
    { label:'UP',              value: up,                     sub:`${pct}% healthy`,               color:'var(--success)' },
    { label:'DOWN',            value: down,                   sub:'need attention',                 color: down  ? 'var(--danger)' : 'var(--success)' },
    { label:'PROD DOWN',       value: prodDown,               sub:'production instances',           color: prodDown ? 'var(--critical)' : 'var(--success)' },
    { label:'CHECKING',        value: checking,               sub:'in progress',                   color:'var(--warn)'    },
  ];
  document.getElementById('summaryStrip').innerHTML = cards.map(c => `
    <div class="stat-card" style="--card-color:${c.color}">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-sub">${c.sub}</div>
    </div>`).join('');
}

/* ----------------------------------------------------------
   6. GROUP TABS
   ---------------------------------------------------------- */
function renderGroupTabs(services) {
  const groups = ['__ALL__', ...new Set(services.map(s => s.apiGroup).sort())];
  const tabsEl = document.getElementById('groupTabs');
  tabsEl.innerHTML = groups.map(g => {
    const label = g === '__ALL__' ? 'All Groups' : g;
    const count = g === '__ALL__' ? services.length : services.filter(s => s.apiGroup === g).length;
    const act   = g === activeGroup ? 'active' : '';
    return `<button class="group-tab ${act}" onclick="setGroup('${g}')">${label}<span class="tab-count">${count}</span></button>`;
  }).join('');
}

function setGroup(group) {
  activeGroup = group;
  renderGroupTabs(registry);
  renderActiveGroup();
}

/* ----------------------------------------------------------
   7. SERVICE TABLE RENDERER
   ---------------------------------------------------------- */
function renderActiveGroup() {
  let services = activeGroup === '__ALL__'
    ? registry
    : registry.filter(s => s.apiGroup === activeGroup);

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    services = services.filter(s =>
      s.apiName.toLowerCase().includes(q) || s.apiGroup.toLowerCase().includes(q)
    );
  }

  // Determine which env columns exist in this view
  const presentEnvs = ENV_ORDER.filter(env =>
    services.some(s => s.instances.some(i => i.env === env))
  );

  renderServiceTable(services, presentEnvs);
}

function renderServiceTable(services, envCols) {
  const container = document.getElementById('tablePanel');

  if (!services.length) {
    container.innerHTML = `<div class="state-overlay"><div style="font-size:2rem;opacity:.3">⌀</div><div>No services match your filter</div></div>`;
    return;
  }

  // Column headers
  const envHeaders = envCols.map(env =>
    `<th class="env-col env-col-${env}">${env.toUpperCase()}</th>`
  ).join('');

  const thead = `<thead><tr>
    <th>Service</th>
    <th>Overall</th>
    ${envHeaders}
  </tr></thead>`;

  // Rows
  const tbody = services.map((svc, idx) => {
    const rh = rowHealth(svc);

    const envCells = envCols.map(env => {
      const instances = svc.instances.filter(i => i.env === env);
      if (!instances.length) {
        return `<td class="env-col"><span class="env-none">—</span></td>`;
      }
      const chips = instances.map(inst => instanceChipHtml(svc, inst)).join('');
      return `<td class="env-col"><div class="instance-stack">${chips}</div></td>`;
    }).join('');

    return `<tr class="${rowHealthCls(rh)}" style="animation-delay:${idx * 20}ms">
      <td class="svc-name-cell">
        <div class="svc-name">${svc.apiName}</div>
        <div class="svc-group-tag">${svc.apiGroup}</div>
      </td>
      <td>${overallBadgeHtml(rh)}</td>
      ${envCells}
    </tr>`;
  }).join('');

  // Count for toolbar
  const totalInst = services.flatMap(s => s.instances).length;

  container.innerHTML = `
    <div class="table-toolbar">
      <div class="toolbar-title">
        ${activeGroup === '__ALL__' ? 'All Services' : activeGroup}
        <span>${services.length} service${services.length !== 1 ? 's' : ''} · ${totalInst} instances</span>
      </div>
    </div>
    <div class="svc-table-wrap">
      <table class="svc-table">
        ${thead}
        <tbody>${tbody}</tbody>
      </table>
    </div>`;
}

function instanceChipHtml(svc, inst) {
  const h      = getHealth(svc.id, inst.env, inst.instanceName);
  const status = h.status || 'unknown';
  const cls    = { up:'inst-up', down:'inst-down', checking:'inst-checking', unknown:'inst-unknown' }[status] || 'inst-unknown';
  const icon   = { up:'●', down:'●', checking:'◌', unknown:'○' }[status] || '○';

  const latency = h.latencyMs != null ? `${h.latencyMs}ms` : '—';
  const checkedAt = h.checkedAt ? new Date(h.checkedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : 'not yet';

  return `
    <div class="tooltip-wrap">
      <span class="instance-chip ${cls}">
        <span class="inst-dot"></span>
        ${inst.instanceName}
      </span>
      <div class="tooltip-box">
        <div class="tooltip-name">${inst.instanceName}</div>
        <div class="tooltip-url">${inst.healthUrl}</div>
        <div class="tooltip-status ${status === 'up' ? 'tooltip-ok' : status === 'down' ? 'tooltip-err' : 'tooltip-chk'}">
          ${status.toUpperCase()}${h.latencyMs != null ? ` · ${latency}` : ''}
        </div>
        <div class="tooltip-url">checked: ${checkedAt}</div>
        ${h.error ? `<div class="tooltip-status tooltip-err">${h.error}</div>` : ''}
      </div>
    </div>`;
}

/* ----------------------------------------------------------
   8. FILTERS & SEARCH
   ---------------------------------------------------------- */
function onSearch(val) {
  searchQuery = val;
  renderActiveGroup();
}

/* ----------------------------------------------------------
   9. DATA LOADING & INIT
   ---------------------------------------------------------- */
async function loadData() {
  document.getElementById('refreshBtn').classList.add('spinning');
  try {
    await new Promise(r => setTimeout(r, 500));
    const json = mockRegistryResponse(); // ← replace with real fetch()

    registry = json.services;
    renderSummary(registry);
    renderGroupTabs(registry);
    renderActiveGroup();

    document.getElementById('lastUpdated').textContent =
      'Loaded ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });

    // Auto-start polling
    startPolling(getIntervalMs());

  } catch(err) {
    document.getElementById('tablePanel').innerHTML = `
      <div class="state-overlay">
        <div style="font-size:2rem">⚠</div>
        <div style="color:var(--danger)">Failed to load registry</div>
        <div style="color:var(--muted);font-size:0.65rem">${err.message}</div>
        <button class="retry-btn" onclick="loadData()">↺ Retry</button>
      </div>`;
  } finally {
    document.getElementById('refreshBtn').classList.remove('spinning');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('intervalSelect').addEventListener('change', () => {
    if (polling) startPolling(getIntervalMs()); // restart with new interval
  });
  loadData();
});
</script>
